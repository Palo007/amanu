# Builds liblocalvqe.dll for Windows in two flavours, because the PC the fork is
# built on has no C++ toolchain: "legacy" (SSE4.2, runs on any x86-64 CPU since
# about 2008) and "avx2" (AVX2 + FMA + F16C + BMI2, the Haswell level: Intel
# since 2013, AMD since Zen). Amanu loads the AVX2 one when the CPU has those
# instructions and falls back to the legacy one otherwise. The steps follow
# windows/native/localvqe/README.md; only the toolchain is MSYS2's MinGW GCC
# instead of w64devkit.
name: LocalVQE Windows DLL

on:
  workflow_dispatch:
  push:
    branches: [build-localvqe]
    paths:
      - .github/workflows/localvqe-windows.yml
      - windows/native/localvqe/localvqe-windows.patch

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: legacy
            ggml: -DGGML_SSE42=ON -DGGML_OPENMP=OFF
            cflags: ""
          - flavour: avx2
            ggml: -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DGGML_OPENMP=OFF
            cflags: -march=haswell -mtune=generic
          # OpenMP keeps ggml's worker threads alive between hops; without it
          # ggml starts and joins its threads for every 16 ms hop.
          - flavour: legacy-omp
            ggml: -DGGML_SSE42=ON -DGGML_OPENMP=ON
            cflags: ""
          - flavour: avx2-omp
            ggml: -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DGGML_OPENMP=ON
            cflags: -march=haswell -mtune=generic
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: amanu

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-binutils

      - name: Check out LocalVQE at the pinned revision
        run: |
          git clone https://github.com/localai-org/LocalVQE.git LocalVQE
          cd LocalVQE
          git checkout f53063c9eb2a85f96479867d1dd911dc3bf6319b
          git submodule update --init --recursive
          test "$(git -C ggml/vendor/ggml rev-parse HEAD)" = c044a8eeae2591faa0950c8b5e514cbc4bbfc4ca
          git apply ../amanu/windows/native/localvqe/localvqe-windows.patch

      - name: Build
        working-directory: LocalVQE
        run: |
          cmake -S ggml -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLOCALVQE_BUILD_SHARED=ON -DGGML_NATIVE=OFF -DGGML_BLAS=OFF \
            ${{ matrix.ggml }} \
            -DCMAKE_C_FLAGS="${{ matrix.cflags }}" -DCMAKE_CXX_FLAGS="${{ matrix.cflags }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build build --config Release --target localvqe_shared -j
          mkdir -p ../out
          grep -E "OpenMP|GGML_OPENMP" build/CMakeCache.txt | head -5 || true
          cp build/liblocalvqe.dll "../out/liblocalvqe-${{ matrix.flavour }}.dll"

      - name: Check imports and print the hash
        run: |
          objdump -p "out/liblocalvqe-${{ matrix.flavour }}.dll" | grep "DLL Name"
          if objdump -p "out/liblocalvqe-${{ matrix.flavour }}.dll" | grep "DLL Name" | grep -viE "kernel32|advapi32|msvcrt|libgomp-1"; then
            echo "unexpected import"; exit 1
          fi
          # The OpenMP flavours need libgomp beside them; ship what it imports too.
          if objdump -p "out/liblocalvqe-${{ matrix.flavour }}.dll" | grep -q "libgomp-1"; then
            cp /mingw64/bin/libgomp-1.dll out/
            objdump -p /mingw64/bin/libgomp-1.dll | grep "DLL Name"
            for dep in $(objdump -p /mingw64/bin/libgomp-1.dll | grep "DLL Name" | awk '{print $3}' | grep -i "^lib"); do cp "/mingw64/bin/$dep" out/; done
          fi
          sha256sum out/*.dll

      - uses: actions/upload-artifact@v4
        with:
          name: liblocalvqe-${{ matrix.flavour }}
          path: out/*.dll
